name: Release Gate

# The full OpenModelica gate is a release activity, not a per-commit check.
# It lives in its own workflow so that pull requests never report it: any job
# in a triggered workflow produces a check run even when its `if` skips it, so
# keeping this in BobLib CI meant every PR showed a permanently skipped
# "OpenModelica Release Gate" entry.
#
# Run it from Actions -> Release Gate -> Run workflow, against the branch or
# tag you are about to release. `make test` / `make ci` is the local equivalent.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  modelica-release:
    name: OpenModelica Release Gate
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.27.1-ompython
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v6
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Lint Python checks
        run: make lint

      - name: Check Modelica formatting
        run: make modelica-lint

      - name: Check mirrored model coverage
        run: make modelica-coverage

      - name: Translate standards and all test fixtures
        run: make modelica-translation PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/translation.xml -ra"

      - name: Check Modelica initialization baselines
        run: make modelica-initialization PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/initialization.xml -ra"

      - name: Run physical validation baselines
        run: make modelica-physics PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/physics.xml -ra"

      - name: Run signal-level regressions
        run: make modelica-regression PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/regression.xml -ra"

      - name: Export and drive the FMUs
        run: make modelica-fmu PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/fmu.xml -ra"

      - name: Run component, contract and Python tests
        run: make test-additional PYTEST_FLAGS="--junitxml=/tmp/boblib-release-results/components.xml -ra"

      - name: Retain test results including skipped checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boblib-release-results
          path: /tmp/boblib-release-results/
          if-no-files-found: warn
