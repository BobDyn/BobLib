name: BobLib CI

on:
  # Feature branches are covered by pull_request. Firing on both events for the
  # same branch produced two runs per commit that wrote check results to the
  # same SHA under the same names, so a required status check could resolve to
  # the cancelled run and block the merge.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref on pull_request and ref_name on push both resolve to the bare
  # branch name, so the duplicate push + pull_request runs for a same-repo PR
  # branch collapse into one. Tag runs are never cancelled; they are the
  # release verification.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Tests/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Lint Python checks
        run: make lint

      - name: Run Python tests
        run: make test-python

      - name: Check Modelica formatting
        run: make modelica-lint

  modelica-smoke:
    name: OpenModelica Smoke
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.26.3-ompython
    needs: python
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v4
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Translate standard smoke models
        run: make modelica-smoke
