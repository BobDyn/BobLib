name: BobLib CI

on:
  # Feature branches are covered by pull_request. Firing on both events for the
  # same branch produced two runs per commit that wrote check results to the
  # same SHA under the same names, so a required status check could resolve to
  # the cancelled run and block the merge.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      full_modelica:
        description: "Run the full OpenModelica release gate"
        required: false
        default: false
        type: boolean

concurrency:
  # head_ref on pull_request and ref_name on push both resolve to the bare
  # branch name, so the duplicate push + pull_request runs for a same-repo PR
  # branch collapse into one. Tag runs are never cancelled; they are the
  # release verification.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Tests/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Lint Python checks
        run: make lint

      - name: Run Python tests
        run: make test-python

      - name: Check Modelica formatting
        run: make modelica-lint

  modelica-smoke:
    name: OpenModelica Smoke
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.26.3-ompython
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_modelica) }}
    needs: python
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v4
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Translate standard smoke models
        run: make modelica-smoke

  modelica-release:
    name: OpenModelica Release Gate
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.26.3-ompython
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_modelica }}
    needs: python
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v4
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Translate standards and all test fixtures
        run: make modelica-translation

      - name: Check Modelica initialization baselines
        run: make modelica-initialization

      - name: Run physical validation baselines
        run: make modelica-physics

      - name: Run signal-level regressions
        run: make modelica-regression
