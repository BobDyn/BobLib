name: BobLib CI

on:
  # Feature branches are covered by pull_request. Firing on both events for the
  # same branch produced two runs per commit that wrote check results to the
  # same SHA under the same names, so a required status check could resolve to
  # the cancelled run and block the merge.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref on pull_request and ref_name on push both resolve to the bare
  # branch name, so the duplicate push + pull_request runs for a same-repo PR
  # branch collapse into one. Tag runs are never cancelled; they are the
  # release verification.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      extra_tests: ${{ steps.classify.outputs.extra_tests }}
      smoke: ${{ steps.classify.outputs.smoke }}
      fmu: ${{ steps.classify.outputs.fmu }}
      components: ${{ steps.classify.outputs.components }}
      shards: ${{ steps.classify.outputs.shards }}
      shard_count: ${{ steps.classify.outputs.shard_count }}
      component_tests: ${{ steps.classify.outputs.component_tests }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build reverse dependencies from both revisions without compiling models.
      # Unknown inputs retain the full gate; pushes/tags/manual runs are full.
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames "$BASE...$HEAD" > /tmp/changed.txt
            cat /tmp/changed.txt
            python3 Tests/ci_changes.py --base "$(git merge-base "$BASE" "$HEAD")" --plan impact-plan.json < /tmp/changed.txt >> "$GITHUB_OUTPUT"
          else
            python3 Tests/ci_changes.py --full --plan impact-plan.json >> "$GITHUB_OUTPUT"
          fi

      - name: Retain dependency plan
        uses: actions/upload-artifact@v4
        with:
          name: modelica-impact-plan
          path: impact-plan.json
          if-no-files-found: error

  python:
    name: Python Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Tests/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Lint Python checks
        run: make lint

      - name: Run Python tests
        run: make test-python

      - name: Check Modelica formatting
        run: make modelica-lint

  modelica-smoke:
    name: OpenModelica Smoke
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.27.1-ompython
    needs: [python, changes]
    if: needs.changes.outputs.smoke == 'true'
    env:
      BOBLIB_IMPACT_PLAN: ${{ github.workspace }}/impact-plan.json
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: modelica-impact-plan

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v6
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Translate standard smoke models
        env:
          FULL_GATE: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL_GATE" = true ]; then
            make modelica-smoke
          else
            make modelica-translation PYTEST_FLAGS="--boblib-impact-report=/tmp/translation-selection.json"
          fi

      - name: Check Modelica initialization baselines
        run: make modelica-initialization PYTEST_FLAGS="--boblib-impact-report=/tmp/initialization-selection.json"

      - name: Retain test selection decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelica-smoke-selection
          path: /tmp/*-selection*.json
          if-no-files-found: ignore

  modelica-components:
    name: OpenModelica Component Contracts (${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }})
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.27.1-ompython
    needs: [python, changes]
    if: needs.changes.outputs.components == 'true'
    env:
      BOBLIB_IMPACT_PLAN: ${{ github.workspace }}/impact-plan.json
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: modelica-impact-plan

      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v6
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      # COMPONENT_TESTS is empty on a full run, so the makefile's own list applies.
      # Each runner runs its shard across every logical CPU. A runner alone tops
      # out near 2x (2 physical cores), so one xdist job took 48 min against
      # 17 min for a four-way split.
      - name: Run component, contract and Python tests
        env:
          EXTRA_TESTS: ${{ needs.changes.outputs.extra_tests }}
          COMPONENT_TESTS: ${{ needs.changes.outputs.component_tests }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }}
        run: make test-additional PYTEST_WORKERS=logical EXTRA_TESTS="$EXTRA_TESTS" ${COMPONENT_TESTS:+ADDITIONAL_TESTS="$COMPONENT_TESTS"} PYTEST_FLAGS="--boblib-impact-report=/tmp/components-selection.json --junitxml=/tmp/boblib-components.xml -ra --boblib-shard $SHARD"

      - name: Retain component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boblib-component-contracts-${{ matrix.shard }}
          path: /tmp/boblib-components.xml
          if-no-files-found: warn

      - name: Retain test selection decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelica-components-selection${{ matrix.shard }}
          path: /tmp/*-selection*.json
          if-no-files-found: ignore

  modelica-components-summary:
    # The one name for the ruleset to require. The shard names change with the
    # shard count, and a skipped matrix job reports only its unexpanded name,
    # so requiring the shards themselves would leave PRs waiting forever.
    # Skipped shards pass here; a failed or cancelled Changes, Python Checks or
    # shard fails it. Changes is checked because its failure skips the shards.
    name: OpenModelica Component Contracts
    runs-on: ubuntu-latest
    needs: [changes, python, modelica-components]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check the contract shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          SHARDS_RESULT: ${{ needs.modelica-components.result }}
        run: |
          echo "Changes: $CHANGES_RESULT"
          echo "Python Checks: $PYTHON_RESULT"
          echo "Component contract shards: $SHARDS_RESULT"
          for result in "$CHANGES_RESULT" "$PYTHON_RESULT" "$SHARDS_RESULT"; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              exit 1
            fi
          done

  modelica-profile:
    name: OpenModelica Profiles
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.27.1-ompython
    needs: python
    if: github.event_name != 'pull_request'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install Python test dependency
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v6
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Install Modelica libraries
        run: make modelica-deps

      - name: Simulate mirrored model coverage and collect profiles
        run: make modelica-profile PROFILE_DIR=/tmp/boblib-profile

      - name: Retain component profiles and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boblib-component-profiles
          path: /tmp/boblib-profile
          if-no-files-found: ignore

  fmu:
    name: FMU Export
    runs-on: ubuntu-latest
    container: openmodelica/openmodelica:v1.27.1-ompython
    needs: [python, changes]
    if: needs.changes.outputs.fmu == 'true'
    env:
      BOBLIB_IMPACT_PLAN: ${{ github.workspace }}/impact-plan.json
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: modelica-impact-plan

      - name: Install Python test dependencies
        run: python3 -m pip install --upgrade pip -r Tests/requirements-dev.txt

      - name: Cache Modelica libraries
        uses: actions/cache@v6
        with:
          path: ~/.openmodelica
          key: om-libs-${{ hashFiles('msl_setup.mos') }}

      - name: Export and drive the FMUs
        run: make modelica-fmu PYTEST_FLAGS="--boblib-impact-report=/tmp/fmu-selection.json"

      - name: Check reusable FMU runtime corrections
        env:
          BOBLIB_TEST_FMU_RUNTIME: "1"
        run: python3 -m pytest Tests/test_fmu_events.py Tests/test_fmu_homotopy.py Tests/test_fmu_tolerance.py Tests/test_fmu_vehicle_calibration.py

      - name: Check native and FMU calibration dependencies
        run: python3 -m pytest Tests/test_calibration_dependencies.py

      - name: Retain test selection decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmu-selection
          path: /tmp/*-selection*.json
          if-no-files-found: ignore
